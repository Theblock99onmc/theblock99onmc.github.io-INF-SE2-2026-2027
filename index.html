<!DOCTYPE html>
<!-- Template version -->
<html lang="nl-NL">
  
  <head>
    <!--dit importeert een library  voor de markdown functies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

    <!-- Standard tags -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- Title & description -->
    <title>Template</title>
    <meta name="description" content="Template site, gemaakt op 26 okt 2026">

    <!-- Other -->
    <meta name="color-scheme" content="light dark">  <!-- support for light and dark mode via browser/OS -->  <!-- https://stephcraft.net/docs/meta -->
    <!-- Opengraph rich preview support-->  <!-- https://ogp.me/ -->  <!-- https://search.google.com/test/rich-results -->
    <meta name="theme-color" content="">  <!-- Theme color is used for rich previews -->
    <meta name="og:site_name" content="Template">
    <meta name="og:title" content="Template">
    <meta name="og:description" content="...">
    <meta name="og:url" content="www.example.com">
    <meta property="og:locale" content="nl-NL">
    <meta property="og:type" content="website">  <!-- https://ogp.me/#types -->

    <link href="author" content="https://github.com/Theblock99onmc">
    
    
  </head>


  
  <body>
    <div class="PageTitle"><!-- Biggest title of the page, shoudl always be visible (sticky) at the top of the page -->
      
    </div>

    <div class="ContentContainer" id="ContentContainer_1"><!-- container for the main page content, contains all the main content for the page. --> 
      <!-- Dit haalt de md-bestand genaamd artikel_01ab.md op en parset hem op het scherm. Sorry man ik kan niet meer -->
      <div id="content"></div>
      <script>
          fetch('.artikel_01ab.md')
              .then(response => {
                  if (!response.ok) throw new Error('Document niet gevonden');
                  return response.text();
              })
              .then(markdown => {
                  document.getElementById('content').innerHTML = marked.parse(markdown);
              })
              .catch(error => {
                  console.error('Fout bij laden:', error);
                  document.getElementById('content').innerHTML = '<p>Kan het document niet laden.</p>';
              });
      </script>

    </div>
    
    <div class="Footer">
    
    </div>  
  </body>
</html>
